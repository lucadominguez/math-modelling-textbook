<script>
const figs=[...document.querySelectorAll('#stage figure')];
const nav=[...document.querySelectorAll('#nav button')];
let idx=-1, sx=0, sy=0, s=false, scale=1;
function show(i){ idx=i; figs.forEach((f,j)=>f.style.display=j===i?'flex':'none');
  nav.forEach((b,j)=>b.classList.toggle('on',j===i)); reset(); }
function reset(){ scale=1; const img=figs[idx].querySelector('img'); img.style.transform='scale(1)'; }
function use(f){ show(f.dataset.i?+f.dataset.i:idx); }
nav.forEach(b=>b.addEventListener('click',()=>show(+b.dataset.i)));
const stage=document.getElementById('stage');
stage.addEventListener('pointerdown',e=>{ s=true; sx=e.clientX; sy=e.clientY; stage.classList.add('pan'); });
window.addEventListener('pointermove',e=>{ if(!s)return; const img=figs[idx].querySelector('img');
  const dx=(e.clientX-sx), dy=(e.clientY-sy); sx=e.clientX; sy=e.clientY;
  const r=img.getBoundingClientRect(); img.style.left=(r.left+dx)+'px'; img.style.top=(r.top+dy)+'px'; });
window.addEventListener('pointerup',()=>{ s=false; stage.classList.remove('pan'); });
stage.addEventListener('wheel',e=>{ e.preventDefault(); const img=figs[idx].querySelector('img');
  scale*=e.deltaY<0?1.12:0.89; scale=Math.min(8,Math.max(0.2,scale));
  img.style.transform='scale('+scale+')'; },{passive:false});
show(0);
</script></body></html>
